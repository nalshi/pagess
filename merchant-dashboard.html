<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">    
    <title>بوابة التاجر | نالش nalsh</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#182a45">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- الأنماط الأساسية والطباعة -->
    <link rel="stylesheet" href="/css/cssd/dashboard-base.css">
    <link rel="stylesheet" href="/css/cssd/dashboard-blue.css">
    <link rel="stylesheet" href="/css/cssd/dashboard-print.css" media="print">

    <!-- الخطوط والأيقونات -->
    <link rel="stylesheet" href="/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<script>try{if(localStorage.getItem('mThm')==='dark')document.body.classList.add('dark-mode');}catch(e){}</script>
<script>
    (function () {
        const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        const lowPerformance = Boolean(
            window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
        ) || Boolean(connection && connection.saveData)
          || (navigator.deviceMemory && navigator.deviceMemory <= 2)
          || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2);
        if (lowPerformance) document.documentElement.classList.add('low-performance');
    })();
</script>

<!-- تنبيه الطلب الجديد العائم -->
<div id="new-order-alert" class="new-order-alert" role="alert" aria-live="assertive" aria-atomic="true" aria-hidden="true">
    <div style="display: flex; align-items: center; gap: 10px;">
        <i data-lucide="bell" class="dashboard-icon shaking-bell-icon"></i>
        <span>طلب جديد واصل الآن! 🛍️</span>
    </div>
    <button type="button" onclick="stopRingingAndGoToOrders()">عرض الطلبات</button>
</div>

<!-- شريط حالة الطلبات النشطة -->
<button id="persistent-order-alert" type="button" class="persistent-alert-bar" onclick="goToPendingOrders()" aria-live="polite" aria-atomic="true" aria-hidden="true">
    <span id="persistent-icon" class="persistent-alert-icon"><i data-lucide="bell" class="dashboard-icon"></i></span>
    <span class="persistent-text-wrapper">
        <span id="persistent-title" class="persistent-title">جاري تحميل الحالة...</span>
        <span id="pending-count-text" class="persistent-subtitle">0 طلب نشط</span>
    </span>
    <span class="persistent-action-btn">متابعة <i data-lucide="arrow-left" class="dashboard-icon"></i></span>
</button>

<!-- شاشة تحميل الاتصال اللحظي -->
<div id="initial-loading-screen">
    <div class="ils-spinner" role="status" aria-label="جاري تحميل لوحة التحكم"></div>

    <script>
    window.ilsUpdate = function() {};
    window.ilsConnectionState = function() {};
    window.appDataReady = false;
    window.introAnimDone = false;

    window.tryRevealApp = function() {
        const ls = document.getElementById('initial-loading-screen');
        const isRealtimeReady = typeof window.isDashboardRealtimeReady === 'function' 
            ? window.isDashboardRealtimeReady() 
            : Boolean(window.dashboardSocketReady && window.dashboardSnapshotLoaded);
        const hasCache = Boolean(
            localStorage.getItem('merchant_products_cache') || 
            localStorage.getItem('merchant_settings_cache')
        );
        if (!ls || ls.dataset.hidden === '1' || !window.appDataReady || (!isRealtimeReady && !hasCache && !window.dashboardConnectionChecked)) return;
        ls.dataset.hidden = '1';
        ls.style.transition = 'opacity 0.12s ease';
        ls.style.opacity = '0';
        setTimeout(() => {
            ls.style.display = 'none';
            if (typeof switchT === 'function') switchT('dashboard');
        }, 80);
    };
    </script>
</div>

<div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<div id="toast" class="toast"><i data-lucide="activity" class="dashboard-icon"></i> <span id="toast-msg"></span></div>

<!-- الهيكل الرئيسي للمحرك (App Shell) -->
<div class="app-container">
    <aside class="sidebar">
        <div class="brand-box">
            <div class="brand-nalsh-logo">
                <div class="nalsh-decor-glow"></div>
                <div class="nalsh-text-ar">نالش</div>
                <div class="nalsh-text-en">nalsh</div>
                <div class="nalsh-decor-line"><span></span></div>
            </div>
            <h2 class="store-name-display" id="ui-store-name">جاري التحميل...</h2>
            <p id="ui-username"></p>
        </div>
        <nav class="nav-links">
            <button class="nav-btn active" data-tab="dashboard"><i data-lucide="layout-dashboard" class="dashboard-icon"></i><span>الرئيسية</span></button>
            <button class="nav-btn" data-tab="management"><i data-lucide="package" class="dashboard-icon"></i><span>المنتجات</span></button>
            <button class="nav-btn" data-tab="orders"><i data-lucide="shopping-bag" class="dashboard-icon"></i><span>الطلبات</span><span id="new-orders-badge" style="background:var(--danger); color:white; font-size:0.65rem; padding:2px 6px; border-radius:50px; margin-right:auto; display:none;">جديد</span></button>
            <button class="nav-btn" data-tab="templates"><i data-lucide="palette" class="dashboard-icon"></i><span>قوالب المتجر</span><span class="nav-new-badge">جديد</span></button>
            <button class="nav-btn" data-tab="settings"><i data-lucide="settings-2" class="dashboard-icon"></i><span>الإعدادات</span></button>
        </nav>
        <button class="btn-main logout-btn"><i data-lucide="log-out" class="dashboard-icon"></i><span>تسجيل الخروج</span></button>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h1 class="page-title" id="page-title">الرئيسية</h1>
            <div class="topbar-actions">
                <button class="action-icon" onclick="toggleTheme()" title="تغيير المظهر" aria-label="تغيير المظهر"><i data-lucide="moon" id="theme-icon" class="dashboard-icon"></i></button>
                <div style="position:relative;">
                    <button id="notification-bell" class="action-icon" onclick="toggleNotificationPanel()" title="سجل النشاطات">
                        <i data-lucide="bell" class="dashboard-icon"></i>
                        <span id="notif-badge" class="notif-badge"></span>
                    </button>
                    <div id="notification-panel">
                        <div class="notif-header">
                            <span>سجل النشاطات</span>
                            <span class="clear" onclick="clearNotifications()">مسح الكل</span>
                        </div>
                        <div id="notif-list" class="notif-list-container"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- شريط مؤشر الانتقال السريع بين الأقسام -->
        <div id="tab-progress-bar" class="tab-progress-bar"></div>

        <!-- حاويات الأقسام (تُحقن تلقائياً عند الطلب) -->
        <section id="dashboard" class="section active"></section>
        <section id="management" class="section" style="display: none;"></section>
        <section id="orders" class="section" style="display: none;"></section>
        <section id="settings" class="section" style="display: none;"></section>
        <section id="templates" class="section" style="display: none;"></section>
    </main>
    
    <nav class="bottom-nav">
        <div class="bottom-nav-inner">
            <button class="b-nav-item active" data-tab="dashboard"><i data-lucide="layout-dashboard" class="dashboard-icon"></i><span>الرئيسية</span></button>
            <button class="b-nav-item" data-tab="management"><i data-lucide="package" class="dashboard-icon"></i><span>المنتجات</span></button>
            <button class="b-nav-item" data-tab="orders" style="position: relative;">
                <i data-lucide="shopping-bag" class="dashboard-icon"></i><span>الطلبات</span>
                <span id="nav-badge-mobile" style="position:absolute; top:4px; right:18px; width:8px; height:8px; background:var(--danger); border-radius:50%; display:none; animation:pulse-badge 2s infinite;"></span>
            </button>
            <button class="b-nav-item" data-tab="templates"><i data-lucide="palette" class="dashboard-icon"></i><span>القوالب</span></button>
            <button class="b-nav-item" data-tab="settings"><i data-lucide="settings-2" class="dashboard-icon"></i><span>إعدادات</span></button>
        </div>
    </nav>
</div>

<div id="print-area" style="display: none;"></div>

<!-- محرك التطبيق الأساسي (Critical Engine) -->
<script src="/js/dashboard/icons.js"></script>
<script src="/js/dashboard/core.js"></script>
<script src="/js/dashboard/ui.js"></script>
<script src="/js/dashboard/notifications.js"></script>
<script src="/js/dashboard/templates.js"></script>
<script>
    function bootApp() {
        if (typeof initTheme === 'function') initTheme();
        if (typeof setupNav === 'function') setupNav();
        if (typeof updateNotificationUI === 'function') updateNotificationUI();
        // ابدأ القناة قبل أي قراءة للكاش أو تحميل أقسام اللوحة.
        if (!window.isLocalTemplateMode && typeof connectDashboardSocket === 'function') connectDashboardSocket();
        document.querySelectorAll('.logout-btn').forEach(btn => {
            btn.onclick = (e) => { e.preventDefault(); handleLogout(); };
        });
        if (typeof verifySessionAndLoad === 'function') verifySessionAndLoad();
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootApp);
    } else {
        bootApp();
    }
</script>
</body>
</html>
